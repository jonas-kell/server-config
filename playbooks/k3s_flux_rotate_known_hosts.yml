---
- name: Rotate Flux Known Hosts using deploy key
  hosts: localhost
  gather_facts: false
  become: false

  vars:
      repo_url: "{{ repo_url_override | default('ssh://git@github.com/jonas-kell/server-config.git') }}"
      branch: "{{ branch_override | default('master') }}"
      cluster_path: "{{ cluster_path_override | default('flux-clusters/piserver') }}"

      encrypted_private_key_path: "{{ playbook_dir }}/../secrets/flux_deploy_key"
      # encrypted_public_key_path: "{{ playbook_dir }}/../secrets/flux_deploy_key.pub"

      temp_key_path: "/tmp/flux_deploy_key"

  tasks:
      - name: Ensure Flux CLI is available
        ansible.builtin.command: flux --version
        changed_when: false

      - name: Ensure Flux can be installed on  the cluster
        ansible.builtin.command: flux check --pre
        changed_when: false

      - name: Decrypt and copy private key to temporary location
        ansible.builtin.copy:
            src: "{{ encrypted_private_key_path }}"
            dest: "{{ temp_key_path }}"
            mode: "0600"
        no_log: true

        # kubectl -n flux-system delete secret flux-system
        # kubectl -n flux-system delete gitrepositories.source.toolkit.fluxcd.io flux-system

      - name: Run flux create secret to regenerate the known hosts data
        ansible.builtin.command:
            cmd: >
                flux create secret git flux-system
                --url={{ repo_url }}
                --private-key-file={{ temp_key_path }}
        register: flux_secret_regen
        changed_when: "'installed' in flux_secret_regen.stdout or flux_secret_regen.rc == 0"

      - name: Log flux secret regeneration stdout
        ansible.builtin.debug:
            msg: "{{ item }}"
        loop: "{{ flux_secret_regen.stdout.split('\n') }}"

      - name: Log flux secret regeneration stderr
        ansible.builtin.debug:
            msg: "{{ item }}"
        loop: "{{ flux_secret_regen.stderr.split('\n') }}"

      - name: Fail explicitly if secret regeneration failed
        ansible.builtin.fail:
            msg: "Flux secret regeneration failed"
        when: flux_secret_regen.rc != 0

      - name: Remove temporary private key
        ansible.builtin.file:
            path: "{{ temp_key_path }}"
            state: absent
        no_log: true
