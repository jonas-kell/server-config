# Installs a local system to my preferences
---
- name: Local Installation
  hosts: localhost
  become: true

  pre_tasks:
      - name: Update apt cache and upgrade packages
        ansible.builtin.package:
            update_cache: true
            cache_valid_time: 1800
            upgrade: "yes"

      - name: Show interpreter
        ansible.builtin.debug:
            var: ansible_python_interpreter

      - name: Show Python version
        ansible.builtin.command: "{{ ansible_python_interpreter }} --version"
        changed_when: false
        register: pyver

      - name: Show interpreter version
        ansible.builtin.debug:
            var: pyver.stdout

  roles:
      - role: dotfiles
        vars:
            dotfiles_profile_name: "jonas"
            dotfiles_device_type: "desktop"
            dotfiles_skip_logiops_driver_compilation: false # for rapid config application
            # !! switches:
            # dotfiles_set_bashrc: true
            # dotfiles_install_kubernetes_clients: true
            # dotfiles_gnome_extensions: true
            # dotfiles_opinionated_apps: true
            # dotfiles_displaylink_compatibility: true
            # dotfiles_install_and_configure_docker: true
            # dotfiles_terminal_and_global_shortcuts: true
            # dotfiles_install_nvm_node: true
            # dotfiles_pdf_tools_xournalpp: true
            # dotfiles_install_nextcloud_desktop: true
            # dotfiles_logiops_driver: true
            # dotfiles_ckb_keyboard_driver: true
            dotfiles_drive_offline_sync: true
