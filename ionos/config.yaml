---
- name: Install and configure nginx
  hosts: ionos1
  become: true

  tasks:
      - name: Install nginx
        ansible.builtin.apt:
            name: nginx
            state: present
            update_cache: true

      - name: Deploy nginx configuration
        ansible.builtin.template:
            src: nginx.conf.j2
            dest: /etc/nginx/nginx.conf
            owner: root
            group: root
            mode: "0644"
        notify: Restart nginx

      - name: Ensure nginx is enabled and running
        ansible.builtin.service:
            name: nginx
            state: started
            enabled: true

  handlers:
      - name: Restart nginx
        ansible.builtin.service:
            name: nginx
            state: restarted
