---
- name: Install ufw
  ansible.builtin.package:
      name:
          - ufw
      state: present
      update_cache: true
      cache_valid_time: 1800

# reset and ssh

- name: Reset UFW
  community.general.ufw:
      state: reset

- name: Reject IPv6 SSH (tcp/22)
  # when: not firewall_allow_ipv6_ssh
  community.general.ufw:
      comment: SSH override
      rule: reject
      direction: in
      port: "22"
      to_ip: "::/0"

- name: Allow SSH (tcp/22) # SSH first so we do not loose access
  community.general.ufw:
      comment: SSH
      rule: allow
      proto: tcp
      port: "22"

- name: Enable UFW with default reject policy
  community.general.ufw:
      state: enabled
      policy: reject

#### How this works
#### First rule that matches is taken
#### the idempotence of this is not reliable -> we need to call "state: reset" and then re-add all rules to ensure order and no rules being lef over
#### because it tries to produce per-rule idempotence, having a deny rule for "to_ip, proto, to_port" and later a accept rule does not work
#### port + proto is used to match rules and they will get overwritten
#### Also adding rules ALWAYS adds them vor ipv4 AND ipv6 (can not be avoided)
#### solution: block rules block udp + tcp, while the allow rules only allow the respective proto
#### as the default is reject, this is still logically correct

# Http

- name: Reject HTTP (tcp/80) on IPv4
  when: firewall_allow_http in ["ipv6"]
  community.general.ufw:
      comment: Http override
      rule: reject
      direction: in
      port: "80"
      to_ip: "0.0.0.0/0"

- name: Reject HTTP (tcp/80) on IPv6
  when: firewall_allow_http in ["ipv4"]
  community.general.ufw:
      comment: Http override
      rule: reject
      direction: in
      port: "80"
      to_ip: "::/0"

- name: Allow HTTP (tcp/80)
  when: firewall_allow_http in ["ipv4", "ipv6", "both"]
  community.general.ufw:
      comment: Http
      rule: allow
      proto: tcp
      port: "80"

