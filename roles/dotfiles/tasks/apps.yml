---
- name: Install System level packages
  ansible.builtin.package:
      name:
          #   - minecraft-launcher
          - inkscape
          - simplescreenrecorder
          - audacity
          - curl
          - wget
          - texlive-full
          - kdenlive
          - ncat
          - rpi-imager
          - wireshark
          - firefox
      state: present
      update_cache: true
      cache_valid_time: 1800

- name: Define Flatpak list
  ansible.builtin.set_fact:
      dotfiles_flatpak_installs:
          - name: org.localsend.localsend_app
          - name: com.discordapp.Discord
          - name: com.github.arminstraub.krop
          - name: com.github.hluk.copyq
          - name: com.spotify.Client
          - name: org.gimp.GIMP
          - name: org.mozilla.Thunderbird
          - name: org.videolan.VLC

- name: Install Flatpaks
  community.general.flatpak:
      name: "{{ item.name }}"
      state: present
      method: user
  loop: "{{ dotfiles_flatpak_installs }}"
  become: false
# ---

# If this fails on a new installation, maybe you need to install
# flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
