---
- name: Install dependencies
  ansible.builtin.package:
      name:
          - gnome-tweaks
          - gnome-shell-extensions
          - python3-gi # needed by gnome-extensions-cli
      state: present
      update_cache: true
      cache_valid_time: 1800

- name: Install gnome-extensions-cli
  community.general.pipx:
      name: gnome-extensions-cli
      state: install
      system_site_packages: true
      executable: "~/.local/bin/pipx" # should use the system-wide pipx
      force: true
      python: "3.10" # must be the default python version of the os (Ubuntu 20.04 = 3.10) you get from "python3 --version"
  become: false

- name: Define GNOME extensions list
  ansible.builtin.set_fact:
      dotfiles_gnome_extensions:
          - name: dash-to-panel@jderose9.github.com
            state: enable
          - name: ding@rastersoft.com
            state: enable
          - name: Vitals@CoreCoding.com
            state: enable
          - name: sound-output-device-chooser@kgshank.net
            state: enable
          - name: extension-list@tu.berry
            state: enable
          - name: gnome-shell-screenshot@ttll.de
            state: enable
          - name: nvidiautil@ethanwharris
            state: enable
          - name: popx11gestures@system76.com
            state: enable
          - name: cosmic-workspaces@system76.com
            state: enable
          - name: pop-cosmic@system76.com
            state: enable
          - name: pop-shell@system76.com
            state: enable
          - name: system76-power@system76.com
            state: enable
          - name: ubuntu-appindicators@ubuntu.com
            state: enable

# https://github.com/essembeh/gnome-extensions-cli
- name: Install GNOME extensions
  ansible.builtin.command:
      cmd: "gext --dbus install {{ item.name }}"
  loop: "{{ dotfiles_gnome_extensions }}"
  become: false
  changed_when: true

- name: Set GNOME extension state (enable/disable)
  ansible.builtin.command:
      cmd: "gext --dbus {{ item.state }} {{ item.name }}"
  loop: "{{ dotfiles_gnome_extensions }}"
  become: false
  changed_when: true

- name: Define GNOME builtin extensions list
  ansible.builtin.set_fact:
      dotfiles_gnome_builtin_extensions:
          - name: cosmic-dock@system76.com
          - name: window-list@gnome-shell-extensions.gcampax.github.com
          - name: windowsNavigator@gnome-shell-extensions.gcampax.github.com
          - name: workspace-indicator@gnome-shell-extensions.gcampax.github.com
          - name: user-theme@gnome-shell-extensions.gcampax.github.com
          - name: screenshot-window-sizer@gnome-shell-extensions.gcampax.github.com
          - name: places-menu@gnome-shell-extensions.gcampax.github.com
          - name: native-window-placement@gnome-shell-extensions.gcampax.github.com
          - name: launch-new-instance@gnome-shell-extensions.gcampax.github.com
          - name: drive-menu@gnome-shell-extensions.gcampax.github.com
          - name: auto-move-windows@gnome-shell-extensions.gcampax.github.com
          - name: apps-menu@gnome-shell-extensions.gcampax.github.com
          - name: nonexistant@dummy.package

# goal: disable       cosmic-dock@system76.com   =    default installed stuff
# deactivate: (were probably installed, because I manually added cosmic-dock but do not use it (as the syntax installs, then deactivates))
# see all: gext --dbus list --all
# I do not know why this does not work over gext (to be honest I do not know whyt I need gext for now even...)
# seems like installation only works properly from online sources for gnome-extensions-cli
- name: Set GNOME extension state (enable/disable)
  ansible.builtin.command:
      cmd: "gnome-extensions disable {{ item.name }}"
  loop: "{{ dotfiles_gnome_builtin_extensions }}"
  become: false
  changed_when: true
  ignore_errors: true # we do not want it to fail if a package is not installed

- name: Render dconf settings template
  ansible.builtin.template:
      src: gnome-extensions-settings.dconf.j2
      dest: /tmp/gnome-extensions-settings.dconf
      owner: root
      group: root
      mode: "0666"

- name: Load dconf settings
  ansible.builtin.shell: dconf load /org/gnome/shell/extensions/ < /tmp/gnome-extensions-settings.dconf
  become: false
  changed_when: true
