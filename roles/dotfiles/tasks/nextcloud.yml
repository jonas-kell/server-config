---
# could use
# - Stock Ubuntu with Nautilus: sudo apt install nautilus-nextcloud
# see https://launchpad.net/~nextcloud-devs/+archive/ubuntu/client -> newer versions in ppa: apt-cache policy nextcloud-desktop -> part of pop

- name: Install Nextcloud Desktop client
  ansible.builtin.package:
      name:
          - nextcloud-desktop # will be able to be moved to tray, because of gnome shell extension enabled!
      state: present
      update_cache: true
      cache_valid_time: 1800
