---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: flux-system
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: flux-system
      sectionName: http # This targets the HTTP listener (port 80)
  rules:
    - matches:
        - path:
            type: Prefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
