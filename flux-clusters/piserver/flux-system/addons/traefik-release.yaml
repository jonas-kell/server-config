apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: 39.0.2
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values: # https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
    providers: # enable Gateway API provider nothing else
      kubernetesCRD:
        enabled: false
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
    gateway: # https://gateway-api.sigs.k8s.io/reference/1.4/spec/#gateway
      # defaultScope: "All" # currently experimental setting
      listeners: # https://gateway-api.sigs.k8s.io/reference/1.4/spec/#listener
        web:
          port: 80
          hostname: ""
          protocol: HTTP
          namespacePolicy: All

  ports:
    web:
      port: 80
      expose:
        default: true
      exposedPort: 80

# This automatically installs a GatewayClass and default Gateway. THis could be overwritten, see https://github.com/marcel-dempers/docker-development-youtube-series/blob/master/kubernetes/gateway-api/values.yaml

# list current listeners               kubectl get gateways.gateway.networking.k8s.io -n flux-system traefik-gateway -o yaml
