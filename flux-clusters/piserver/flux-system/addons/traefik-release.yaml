apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: 39.0.2
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: traefic-deploy-values
      valuesKey: ./traefik-values.yaml

# list current listeners               kubectl get gateways.gateway.networking.k8s.io -n flux-system traefik-gateway -o yaml
