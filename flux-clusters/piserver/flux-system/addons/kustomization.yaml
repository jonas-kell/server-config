---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: traefik-values
    files:
      - values.yaml=traefik-values.yaml
generatorOptions:
  disableNameSuffixHash: true
resources:
  - gateway-api-source.yaml
  - gateway-api-crds.yaml
  - traefik-source.yaml
  - traefik-chart.yaml
  - traefik-release.yaml
